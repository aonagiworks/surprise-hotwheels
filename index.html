<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFD100" />
  <title>Hot Wheels · For You 🏎️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --yellow: #FFD100;
      --red: #E10600;
      --orange: #FF6A00;
      --black: #0A0A0A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--yellow);
      color: #111;
      overflow: hidden;
    }
    button { font: inherit; border: 0; cursor: pointer; background: none; color: inherit; }
    button:active { transform: scale(.97); }

    /* PIN */
    #pwScreen {
      position: fixed; inset: 0; z-index: 300;
      display: grid; place-items: center;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,209,0,.22), transparent 50%), #0A0A0A;
      transition: opacity .5s ease, transform .5s ease;
      padding: 1rem;
    }
    #pwScreen.hidden { opacity: 0; transform: scale(1.04); pointer-events: none; }
    .pw-card {
      width: min(100%, 360px);
      background: #111; border: 4px solid #000; border-radius: 18px;
      overflow: hidden;
      box-shadow: 8px 8px 0 #000, 0 0 0 3px var(--yellow);
    }
    .pw-stripe { height: 16px; background: repeating-linear-gradient(90deg, #000 0 16px, #fff 16px 32px); }
    .pw-body { padding: 1.25rem 1.1rem; text-align: center; color: #fff; }
    .pw-body .logo {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: 2.2rem; letter-spacing: .04em;
      background: linear-gradient(180deg, #FFE566, #FFD100 40%, #FF6A00 75%, #E10600);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 2px 0 #5A0000);
    }
    .pw-body .sub { font-size: .78rem; color: #aaa; margin: .25rem 0 .85rem; font-weight: 600; }
    .pw-display {
      background: #000; border: 3px solid #333; border-radius: 12px;
      padding: .7rem; font-family: Outfit, sans-serif; font-weight: 800;
      font-size: 1.45rem; letter-spacing: .4em; color: var(--yellow);
      margin-bottom: .7rem;
    }
    .pw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; }
    .pw-grid button {
      padding: .8rem; font-size: 1.2rem; font-weight: 800;
      border-radius: 12px; border: 3px solid #000;
      background: linear-gradient(180deg, #2A2A2A, #151515);
      color: #fff; box-shadow: 2px 2px 0 #000;
      font-family: Outfit, sans-serif;
    }
    .pw-grid button:hover { background: linear-gradient(180deg, #E10600, #8B0000); }
    .pw-grid .del { color: #FF8A8A; }
    .pw-error { min-height: 1.15rem; color: #FF6B6B; font-size: .8rem; font-weight: 700; margin-top: .45rem; }
    .pw-hint { font-size: .72rem; color: #777; margin-top: .35rem; }

    /* MAIN SCREEN */
    #world { display: none; height: 100%; background: var(--yellow); }
    #world.show { display: flex; flex-direction: column; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: .5rem;
      padding: .55rem .75rem;
      background: #000; color: #fff;
      border-bottom: 4px solid var(--yellow);
      position: relative; z-index: 10;
    }
    .topbar .brand {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: 1.25rem; letter-spacing: .05em; color: var(--yellow);
    }
    .chip {
      border: 2px solid #333; background: #1a1a1a; color: #fff;
      border-radius: 999px; padding: .35rem .75rem;
      font-size: .72rem; font-weight: 800;
    }
    .chip:hover { border-color: var(--yellow); color: var(--yellow); }
    .chip.on { background: var(--red); border-color: #000; }

    .stage {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: .5rem .75rem 1rem;
      position: relative;
    }

    .track-scene {
      width: min(100%, 680px);
      height: min(50vh, 340px);
      border: 4px solid #000;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 55%, #222 55%, #111 100%);
      box-shadow: 8px 8px 0 rgba(0,0,0,.5);
      position: relative;
    }
    .track-road {
      position: absolute; left: 0; right: 0; bottom: 0; height: 36%;
      background: #2a2a2a;
      border-top: 4px solid #444;
    }
    .track-road::before {
      content: "";
      position: absolute; left: 0; right: 0; top: 48%;
      height: 4px;
      background: repeating-linear-gradient(90deg, var(--yellow) 0 28px, transparent 28px 48px);
      animation: dash .6s linear infinite;
    }
    @keyframes dash {
      from { background-position: 0 0; }
      to { background-position: 48px 0; }
    }
    .track-check {
      position: absolute; left: 0; top: 0; bottom: 36%; width: 36px;
      background: repeating-linear-gradient(0deg, #000 0 12px, #fff 12px 24px);
      opacity: .9;
    }

    .hb-banner {
      position: absolute; left: 50%; top: 10%;
      transform: translateX(-50%) scale(.6);
      opacity: 0;
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: clamp(1.6rem, 6vw, 3rem);
      letter-spacing: .06em;
      line-height: .95;
      text-align: center;
      color: var(--yellow);
      text-shadow: 3px 3px 0 #000, 0 0 20px rgba(255,106,0,.6);
      z-index: 4;
      pointer-events: none;
    }
    .hb-banner.show { animation: hbPop 1.1s cubic-bezier(.2,1.2,.3,1) forwards; }
    .hb-banner .who { display: block; color: #fff; font-size: .55em; letter-spacing: .12em; opacity: .95; }
    @keyframes hbPop {
      0% { opacity: 0; transform: translateX(-50%) scale(.3) translateY(30px); }
      60% { opacity: 1; transform: translateX(-50%) scale(1.08) translateY(0); }
      100% { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
    }

    .racer {
      position: absolute; bottom: 14%; left: -40%;
      width: min(55vw, 260px); z-index: 3;
    }
    .racer.run { animation: raceAcross 2.4s cubic-bezier(.2,.7,.2,1) forwards; }
    .racer.idle { left: 10%; animation: idleBob 1.6s ease-in-out infinite; }
    @keyframes raceAcross {
      0% { left: -45%; }
      40% { transform: translateY(-4px); }
      100% { left: 52%; }
    }
    @keyframes idleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .racer svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 14px rgba(0,0,0,.5)); }
    .exhaust {
      position: absolute; left: -8%; top: 48%;
      width: 60px; height: 40px; pointer-events: none;
    }
    .exhaust i {
      position: absolute; left: 0; top: 50%;
      width: 12px; height: 12px; border-radius: 50%;
      background: radial-gradient(circle, #FFD100, #FF6A00 45%, transparent 70%);
      opacity: 0;
      animation: smoke .55s ease-out infinite;
    }
    .exhaust i:nth-child(2) { animation-delay: .12s; width: 16px; height: 16px; top: 35%; }
    .exhaust i:nth-child(3) { animation-delay: .24s; width: 20px; height: 20px; top: 55%; }
    .exhaust i:nth-child(4) { animation-delay: .36s; width: 14px; height: 14px; top: 42%; }
    .racer.run .exhaust i { animation-duration: .35s; }
    @keyframes smoke {
      0% { transform: translate(0, -50%) scale(.4); opacity: .9; }
      100% { transform: translate(-40px, -50%) scale(1.5); opacity: 0; }
    }

    /* Quick action buttons under track */
    .quick {
      margin-top: .75rem;
      display: flex; flex-wrap: wrap; gap: .5rem;
      justify-content: center;
    }
    .quick .act {
      border: 3px solid #000; border-radius: 999px;
      padding: .6rem 1rem; font-weight: 800; font-size: .85rem;
      background: #000; color: var(--yellow);
      box-shadow: 4px 4px 0 rgba(0,0,0,.35);
      transition: .12s ease;
    }
    .quick .act:hover { background: var(--red); color: #fff; transform: translate(-1px,-1px); }

    /* Modal */
    .modal-back {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.65); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-back.open { display: flex; }
    .modal-box {
      width: min(100%, 420px);
      max-height: 80vh; overflow: auto;
      border: 4px solid #000; border-radius: 20px;
      background: #111; color: #fff;
      box-shadow: 10px 10px 0 rgba(0,0,0,.65);
      animation: modalIn .25s ease;
      padding: 1.2rem 1rem 1rem;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(.88); }
      to { opacity: 1; transform: none; }
    }
    .modal-box .mhead {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: .65rem;
    }
    .modal-box .mhead h2 {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: 1.5rem; letter-spacing: .04em; color: var(--yellow);
    }
    .modal-box .mhead button {
      color: #999; font-size: 1.2rem; padding: .2rem .5rem;
      border: 2px solid #333; border-radius: 10px;
    }
    .modal-box p { color: #ccc; font-size: .9rem; line-height: 1.6; }
    .msg-box { min-height: 4rem; font-size: .92rem; color: #eee; line-height: 1.65; }
    .msg-box strong { color: #fff; }

    .photo-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0,1fr));
      gap: .5rem;
    }
    .ph {
      aspect-ratio: 1; border-radius: 12px; overflow: hidden;
      border: 3px solid #333; background: #1a1a1a; position: relative;
    }
    .ph img { width: 100%; height: 100%; object-fit: cover; }
    .ph .placeholder {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #666; font-size: .72rem; font-weight: 700; text-align: center; padding: .4rem;
    }

    .wish-row { display: flex; flex-wrap: wrap; gap: .4rem; }
    .wish-row input {
      flex: 1 1 160px; min-width: 0;
      border: 3px solid #333; border-radius: 10px;
      background: #0a0a0a; color: #fff; padding: .65rem .75rem; font-weight: 600;
    }
    .wish-list { margin-top: .5rem; display: grid; gap: .3rem; max-height: 130px; overflow: auto; }
    .wish-item {
      display: flex; justify-content: space-between; gap: .4rem; align-items: center;
      background: rgba(255,209,0,.08); border: 2px solid #333; border-radius: 10px;
      padding: .45rem .6rem; font-size: .8rem; font-weight: 600; color: #eee;
    }
    .wish-item button { color: #FF8A8A; font-weight: 800; font-size: .72rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
      border: 3px solid #000; border-radius: 12px;
      padding: .6rem .9rem; font-weight: 800; font-size: .82rem;
      box-shadow: 3px 3px 0 #000;
    }
    .btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 #000; }
    .btn-yellow { background: var(--yellow); color: #000; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-black { background: #000; color: #fff; }
    .btn-row { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .75rem; }

    .toast {
      position: fixed; left: 50%; bottom: 14px; z-index: 250;
      transform: translateX(-50%) translateY(14px);
      background: #000; color: #fff; border: 3px solid var(--yellow);
      border-radius: 999px; padding: .45rem .9rem;
      font-weight: 800; font-size: .78rem; opacity: 0; pointer-events: none;
      transition: .22s ease; max-width: min(92vw, 360px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 240; overflow: hidden; }
    .piece { position: absolute; top: -12px; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

    audio#bgMusic { display: none; }

    @media (max-width: 640px) {
      .track-scene { height: 42vh; }
      .racer { width: min(72vw, 220px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .racer.run, .racer.idle, .track-road::before, .piece, .exhaust i { animation: none !important; }
      .racer { left: 30%; }
      .hb-banner { opacity: 1; transform: translateX(-50%) scale(1); }
    }
  </style>
</head>
<body>

<div class="confetti" id="confetti"></div>
<div class="toast" id="toast"></div>
<audio id="bgMusic" loop preload="none"></audio>

<!-- PIN -->
<div id="pwScreen">
  <div class="pw-card">
    <div class="pw-stripe"></div>
    <div class="pw-body">
      <div class="logo">HOT WHEELS</div>
      <div class="sub">🏎️ START YOUR ENGINE — masukin PIN dulu</div>
      <div class="pw-display" id="pwDisplay">••••••</div>
      <div class="pw-grid" id="pwGrid">
        <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
        <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
        <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
        <button data-n="" disabled></button>
        <button data-n="0">0</button>
        <button class="del" id="pwDel">⌫</button>
      </div>
      <div class="pw-error" id="pwError"></div>
      <p class="pw-hint">petunjuk : 6 digit spesial 🏁</p>
    </div>
    <div class="pw-stripe"></div>
  </div>
</div>

<!-- MAIN: track + quick actions + modals -->
<div id="world">
  <div class="topbar">
    <div class="brand">HOT WHEELS</div>
    <div>
      <button class="chip" type="button" id="btnMusic">🎵</button>
      <button class="chip" type="button" id="btnConfettiTop">🎉</button>
    </div>
  </div>

  <div class="stage">
    <div class="track-scene" id="track">
      <div class="track-check"></div>
      <div class="track-road"></div>
      <div class="hb-banner" id="hbBanner">
        HAPPY BIRTHDAY
        <span class="who" id="hbName">SAYANG</span>
      </div>
      <div class="racer" id="racer">
        <div class="exhaust"><i></i><i></i><i></i><i></i></div>
        <svg viewBox="0 0 640 320" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="body" x1="80" y1="40" x2="560" y2="260"><stop stop-color="#FF2A2A"/><stop offset=".35" stop-color="#E10600"/><stop offset=".7" stop-color="#B00000"/><stop offset="1" stop-color="#6A0000"/></linearGradient>
            <linearGradient id="shine" x1="160" y1="70" x2="420" y2="180"><stop stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
            <radialGradient id="head" cx=".3" cy=".4" r=".7"><stop stop-color="#9FE8FF"/><stop offset="1" stop-color="#2BB8FF" stop-opacity=".3"/></radialGradient>
          </defs>
          <ellipse cx="320" cy="292" rx="210" ry="14" fill="#000" opacity=".45"/>
          <path d="M455 95h95c6 0 10 4 10 9v8c0 4-3 7-8 7h-28l-12 28h-18l10-28h-39c-5 0-8-4-8-8v-6c0-5 4-10 10-10z" fill="#111"/>
          <path d="M528 95v24" stroke="#E10600" stroke-width="3"/>
          <path d="M545 102h18" stroke="#FFD100" stroke-width="3" stroke-linecap="round"/>
          <path fill="url(#body)" d="M78 200C90 168 120 145 165 132L250 108C295 92 340 88 390 95L470 112C510 122 545 145 565 175L580 200C585 210 582 222 568 228L520 240 430 248 210 248 120 238C95 232 78 218 78 200Z"/>
          <path d="M310 185C340 170 370 175 390 190 370 185 345 188 320 198Z" fill="#FFD100"/>
          <path d="M318 188C345 176 368 180 385 192 365 186 345 190 325 198Z" fill="#FF6A00"/>
          <path d="M325 192C348 182 365 186 378 194 360 188 345 192 330 198Z" fill="#E10600"/>
          <path d="M170 130C240 105 340 100 450 125 400 140 300 145 210 155Z" fill="url(#shine)"/>
          <circle cx="455" cy="235" r="48" fill="#0a0a0a"/><circle cx="455" cy="235" r="42" fill="#111" stroke="#E10600" stroke-width="5"/><circle cx="455" cy="235" r="28" fill="#333"/><circle cx="455" cy="235" r="12" fill="#222" stroke="#E10600" stroke-width="3"/>
          <path d="M455 207L455 263 M427 235L483 235 M435 215L475 255 M475 215L435 255" stroke="#666" stroke-width="3"/>
          <circle cx="175" cy="235" r="48" fill="#0a0a0a"/><circle cx="175" cy="235" r="42" fill="#111" stroke="#E10600" stroke-width="5"/><circle cx="175" cy="235" r="28" fill="#333"/><circle cx="175" cy="235" r="12" fill="#222" stroke="#E10600" stroke-width="3"/>
          <path d="M175 207L175 263 M147 235L203 235 M155 215L195 255 M195 215L155 255" stroke="#666" stroke-width="3"/>
        </svg>
      </div>
    </div>

    <div class="quick" id="quickBtns">
      <button class="act" type="button" id="qMsg">💌 Baca Ucapan</button>
      <button class="act" type="button" id="qPhoto">📸 Foto</button>
      <button class="act" type="button" id="qWish">🏁 Wish</button>
      <button class="act" type="button" id="qRace">🏎️ Gas!</button>
      <button class="act" type="button" id="qShare">🔗 Share</button>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-back" id="modalMsg"><div class="modal-box">
  <div class="mhead"><h2>💌 MESSAGE</h2><button id="mMsgClose" class="close-btn">✕</button></div>
  <div class="msg-box" id="mainMessage"></div>
</div></div>

<div class="modal-back" id="modalPhoto"><div class="modal-box">
  <div class="mhead"><h2>📸 FOTO</h2><button id="mPhotoClose" class="close-btn">✕</button></div>
  <div class="photo-grid" id="photoGrid">
    <div class="ph" id="ph1"><div class="placeholder">foto 1</div></div>
    <div class="ph" id="ph2"><div class="placeholder">foto 2</div></div>
    <div class="ph" id="ph3"><div class="placeholder">foto 3</div></div>
    <div class="ph" id="ph4"><div class="placeholder">foto 4</div></div>
  </div>
</div></div>

<div class="modal-back" id="modalWish"><div class="modal-box">
  <div class="mhead"><h2>🏁 WISH</h2><button id="mWishClose" class="close-btn">✕</button></div>
  <p style="margin-bottom:.5rem">Tulis harapan buat hari ini!</p>
  <div class="wish-row">
    <input id="wishInput" type="text" maxlength="80" placeholder="Harapan…" />
    <button class="btn btn-yellow" type="button" id="btnAddWish">➕</button>
    <button class="btn btn-black" type="button" id="btnRandomWish">🎲</button>
  </div>
  <div class="wish-list" id="wishList"></div>
</div></div>

<script>
(function () {
  const PW = "130605";
  const RECIPIENT = "SAYANG";
  const MUSIC_URL = "";   // John Lennon — Beautiful Boy — upload MP3 ke assets/beautiful-boy.mp3 lalu ganti jadi "assets/beautiful-boy.mp3"
  const PHOTOS = [];      // ganti array URL foto

  const $ = id => document.getElementById(id);
  let pin = "", MAX = 6, musicOn = false;

  $("hbName").textContent = RECIPIENT;

  function toast(msg) {
    $("toast").textContent = msg; $("toast").classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => $("toast").classList.remove("show"), 1700);
  }
  function confetti() {
    const box = $("confetti"); const colors = ["#E10600","#FFD100","#FF6A00","#000","#fff"];
    box.innerHTML = "";
    for (let i = 0; i < 70; i++) {
      const el = document.createElement("div"); el.className = "piece";
      el.style.cssText = "left:" + Math.random() * 100 + "%;background:" + colors[i % colors.length] + ";width:" + (6 + Math.random() * 10) + "px;height:" + (6 + Math.random() * 10) + "px;border-radius:" + (Math.random() > .5 ? "50%" : "2px") + ";animation-duration:" + (1.5 + Math.random() * 2.5) + "s;animation-delay:" + Math.random() + "s";
      box.appendChild(el);
    }
    setTimeout(() => { box.innerHTML = ""; }, 4500);
  }
  function runCar() {
    const r = $("racer"), b = $("hbBanner");
    r.classList.remove("run", "idle"); b.classList.remove("show");
    void r.offsetWidth; r.classList.add("run");
    setTimeout(() => { b.classList.add("show"); confetti(); }, 900);
    setTimeout(() => { r.classList.remove("run"); r.classList.add("idle"); }, 2500);
  }
  function typeMsg() {
    const box = $("mainMessage");
    const full = "Ka-chow! 🏁 Satu hari buat merayakan umurmu, sejuta alasan buat bersyukur karena kenal kamu. Gas pol terus ke depan — tire grip kuat, engine nyala, dan aku di pit crew kamu. 🔥";
    box.textContent = ""; let i = 0;
    clearInterval(box._t); box._t = setInterval(() => { box.textContent = full.slice(0, ++i); if (i >= full.length) clearInterval(box._t); }, 16);
  }
  function openModal(id) { $("modal" + id).classList.add("open"); }
  function closeModal(id) { $("modal" + id).classList.remove("open"); }

  // PIN
  $("pwGrid").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "pwDel") { pin = pin.slice(0, -1); renderPin(); return; }
    const n = b.getAttribute("data-n");
    if (!n || pin.length >= MAX) return; pin += n; renderPin();
    if (pin.length === MAX) {
      if (pin === PW) {
        $("pwScreen").classList.add("hidden"); $("world").classList.add("show");
        runCar(); typeMsg();
        const a = $("bgMusic");
        if (a.src) { a.play().catch(()=>{}); musicOn = true; $("btnMusic").classList.add("on"); }
        toast("🏁 Halo " + RECIPIENT + "!");
      } else { $("pwError").textContent = "❌ PIN salah"; setTimeout(() => { pin = ""; renderPin(); }, 600); }
    }
  });
  function renderPin() {
    let s = ""; for (let i = 0; i < MAX; i++) s += i < pin.length ? "●" : "•";
    $("pwDisplay").textContent = s; $("pwError").textContent = "";
  }

  // Music
  const audio = $("bgMusic");
  if (MUSIC_URL) audio.src = MUSIC_URL;
  $("btnMusic").addEventListener("click", () => {
    if (!audio.src) { toast("🎵 Belum ada lagu"); return; }
    musicOn = !musicOn;
    if (musicOn) { audio.play().catch(()=>{}); $("btnMusic").classList.add("on"); } else { audio.pause(); $("btnMusic").classList.remove("on"); }
  });

  // Quick actions
  $("qMsg").addEventListener("click", () => { openModal("Msg"); typeMsg(); toast("💌 Baca ucapan"); });
  $("qPhoto").addEventListener("click", () => { openModal("Photo"); toast("📸 Foto"); });
  $("qWish").addEventListener("click", () => { openModal("Wish"); renderWishes(); });
  $("qRace").addEventListener("click", () => { runCar(); toast("🏎️ Gas!"); });
  $("qShare").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(location.href); toast("🔗 Link disalin!"); } catch(e) { toast(location.href); }
  });
  $("btnConfettiTop").addEventListener("click", () => { confetti(); toast("🎉"); });

  // Close modals
  ["Msg","Photo","Wish"].forEach(id => {
    const closeBtn = document.querySelector("#modal" + id + " .close-btn");
    if (closeBtn) closeBtn.addEventListener("click", () => closeModal(id));
    const back = $("modal" + id);
    back.addEventListener("click", (e) => { if (e.target === back) closeModal(id); });
  });

  // Wish
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function renderWishes() {
    let arr = []; try { arr = JSON.parse(localStorage.getItem("hw-wishes") || "[]"); } catch(e) {}
    $("wishList").innerHTML = arr.map((w,i) => `<div class="wish-item"><span>🏁 ${esc(w)}</span></div>`).join("");
  }
  $("btnAddWish").addEventListener("click", () => {
    const v = $("wishInput").value.trim(); if (!v) return toast("Tulis dulu!");
    let arr = []; try { arr = JSON.parse(localStorage.getItem("hw-wishes") || "[]"); } catch(e) {}
    arr.unshift(v); localStorage.setItem("hw-wishes", JSON.stringify(arr.slice(0, 12)));
    $("wishInput").value = ""; renderWishes(); confetti(); toast("✅ Wish ditambah!");
  });
  $("btnRandomWish").addEventListener("click", () => {
    const w = ["Full boost! 🔥","Tire grip kuat ❤️","Ka-chow forever! ⚡","Finish line! 🏁"][Math.floor(Math.random() * 4)];
    $("wishInput").value = w; toast("🎲 " + w);
  });

  // Photos
  PHOTOS.forEach((url, i) => {
    const ph = $("ph" + (i+1));
    if (!ph || !url) return;
    const img = document.createElement("img"); img.src = url; img.alt = "foto " + (i+1);
    ph.appendChild(img); ph.classList.add("has-img");
  });

  renderPin(); renderWishes();
})();
</script>
</body>
</html>

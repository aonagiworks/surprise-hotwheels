<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <defs>
    <linearGradient id="body" x1="80" y1="40" x2="560" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2A2A"/>
      <stop offset="0.35" stop-color="#E10600"/>
      <stop offset="0.7" stop-color="#B00000"/>
      <stop offset="1" stop-color="#6A0000"/>
    </linearGradient>
    <linearGradient id="shine" x1="160" y1="70" x2="420" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="250" y1="90" x2="430" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a2a3a"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#333"/>
      <stop offset="0.5" stop-color="#111"/>
      <stop offset="1" stop-color="#444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="head" cx="0.3" cy="0.4" r="0.7">
      <stop stop-color="#9FE8FF"/>
      <stop offset="1" stop-color="#2BB8FF" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- soft ground reflection -->
  <ellipse cx="320" cy="292" rx="210" ry="14" fill="#000" opacity="0.45"/>

  <!-- rear wing -->
  <path d="M455 95h95c6 0 10 4 10 9v8c0 4-3 7-8 7h-28l-12 28h-18l10-28h-39c-5 0-8-4-8-8v-6c0-5 4-10 10-10z" fill="#111"/>
  <path d="M528 95v24" stroke="#E10600" stroke-width="3"/>
  <path d="M545 102h18" stroke="#FFD100" stroke-width="3" stroke-linecap="round"/>

  <!-- main body -->
  <path filter="url(#glow)" fill="url(#body)" d="M78 200
    C90 168 120 145 165 132
    L250 108
    C295 92 340 88 390 95
    L470 112
    C510 122 545 145 565 175
    L580 200
    C585 210 582 222 568 228
    L520 240
    L430 248
    L210 248
    L120 238
    C95 232 78 218 78 200Z"/>

  <!-- lower splitter / skirt -->
  <path d="M95 228 L200 242 L430 242 L530 232 C548 228 560 220 558 210 L545 200 C520 215 470 228 400 232 L210 232 C150 228 110 220 95 210Z" fill="#1a0000" opacity="0.55"/>

  <!-- hood vents -->
  <path d="M175 145 L250 128 L255 138 L180 155Z" fill="#0a0a0a" opacity="0.55"/>
  <path d="M185 158 L255 142 L258 150 L190 165Z" fill="#0a0a0a" opacity="0.4"/>

  <!-- cabin glass -->
  <path d="M265 118
    C310 100 360 100 410 112
    L445 128
    C430 145 400 155 360 158
    L290 158
    C270 150 260 135 265 118Z" fill="url(#glass)" stroke="#0ff" stroke-opacity="0.15"/>
  <path d="M280 122 C320 108 370 108 410 118" stroke="#9FE8FF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- side scoop -->
  <path d="M300 175 C330 168 370 168 405 175 L400 195 C365 190 330 190 300 195Z" fill="#0a0a0a" opacity="0.5"/>

  <!-- headlights -->
  <ellipse cx="130" cy="175" rx="28" ry="10" fill="url(#head)" opacity="0.95"/>
  <ellipse cx="130" cy="175" rx="28" ry="10" stroke="#9FE8FF" stroke-opacity="0.6"/>
  <ellipse cx="155" cy="168" rx="10" ry="5" fill="#CFFFFF" opacity="0.7"/>

  <!-- front grille -->
  <path d="M88 190 C100 200 120 208 145 210 L140 222 C115 218 95 208 85 198Z" fill="#0a0a0a"/>
  <path d="M95 198 L140 212" stroke="#333" stroke-width="1.5"/>
  <path d="M100 204 L138 216" stroke="#333" stroke-width="1.5"/>

  <!-- Hot Wheels style side flame mark (simple) -->
  <path d="M310 185 C340 170 370 175 390 190 C370 185 345 188 320 198Z" fill="#FFD100"/>
  <path d="M318 188 C345 176 368 180 385 192 C365 186 345 190 325 198Z" fill="#FF6A00"/>
  <path d="M325 192 C348 182 365 186 378 194 C360 188 345 192 330 198Z" fill="#E10600"/>

  <!-- body shine -->
  <path d="M170 130 C240 105 340 100 450 125 C400 140 300 145 210 155Z" fill="url(#shine)"/>

  <!-- wheels -->
  <g>
    <!-- rear wheel -->
    <circle cx="455" cy="235" r="48" fill="#0a0a0a"/>
    <circle cx="455" cy="235" r="42" fill="#111" stroke="#E10600" stroke-width="5"/>
    <circle cx="455" cy="235" r="28" fill="url(#rim)"/>
    <circle cx="455" cy="235" r="12" fill="#222" stroke="#E10600" stroke-width="3"/>
    <path d="M455 207 L455 263 M427 235 L483 235 M435 215 L475 255 M475 215 L435 255" stroke="#666" stroke-width="3"/>
    <!-- front wheel -->
    <circle cx="175" cy="235" r="48" fill="#0a0a0a"/>
    <circle cx="175" cy="235" r="42" fill="#111" stroke="#E10600" stroke-width="5"/>
    <circle cx="175" cy="235" r="28" fill="url(#rim)"/>
    <circle cx="175" cy="235" r="12" fill="#222" stroke="#E10600" stroke-width="3"/>
    <path d="M175 207 L175 263 M147 235 L203 235 M155 215 L195 255 M195 215 L155 255" stroke="#666" stroke-width="3"/>
  </g>

  <!-- side mirror -->
  <path d="M300 125 L318 118 L322 128 L305 135Z" fill="#222"/>
  <ellipse cx="320" cy="120" rx="8" ry="5" fill="#9FE8FF" opacity="0.35"/>
</svg>
